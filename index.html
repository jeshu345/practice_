<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Git Bash Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#0f172a;        /* slate-900 */
    --panel:#111827;     /* gray-900 */
    --card:#1f2937;      /* gray-800 */
    --ink:#e5e7eb;       /* gray-200 */
    --muted:#9ca3af;     /* gray-400 */
    --accent:#22c55e;    /* green-500 */
    --accent-2:#3b82f6;  /* blue-500 */
    --accent-3:#f59e0b;  /* amber-500 */
    --accent-4:#ef4444;  /* red-500 */
    --purple:#a78bfa;    /* violet-400 */
    --cyan:#06b6d4;      /* cyan-500 */
    --border:#374151;    /* gray-700 */
  }
  *{box-sizing:border-box}
  body{
    margin:0; background: radial-gradient(1200px 800px at 20% -10%, #1e293b 0, #0b1222 60%, var(--bg) 100%);
    color:var(--ink); font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial;
  }
  header{
    padding:22px 20px; border-bottom:1px solid var(--border);
    background:linear-gradient(120deg, rgba(34,197,94,.08), rgba(59,130,246,.08) 50%, rgba(167,139,250,.08));
    position:sticky; top:0; z-index:10;
  }
  .brand{display:flex; align-items:center; gap:12px}
  .logo{
    width:42px; height:42px; border-radius:12px; display:grid; place-items:center;
    background:conic-gradient(from 210deg, var(--accent), var(--accent-2), var(--purple), var(--cyan), var(--accent));
    color:#0b1020; font-weight:900; box-shadow:0 0 0 3px #0b1020 inset, 0 10px 30px rgba(0,0,0,.35);
  }
  .title{font-size:20px; font-weight:800; letter-spacing:.4px}
  .sub{color:var(--muted); font-size:13px}

  .wrap{max-width:1100px; margin:22px auto; padding:0 16px}
  .grid{
    display:grid; gap:16px;
    grid-template-columns: repeat(12, 1fr);
  }
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.00));
    border:1px solid var(--border); border-radius:16px; padding:16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .card h3{margin:0 0 8px; font-size:16px}
  .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px}
  label{font-size:12px; color:var(--muted)}
  input, select, textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:#0b1220; color:var(--ink); outline:none;
  }
  textarea{min-height:74px; resize:vertical}
  .btn{
    border:none; padding:10px 14px; border-radius:10px; color:#061019; font-weight:700; cursor:pointer;
    transition:transform .04s ease, filter .2s ease; display:inline-flex; align-items:center; gap:8px;
  }
  .btn:active{transform:scale(.98)}
  .btn.green{background:linear-gradient(135deg, var(--accent), #16a34a)}
  .btn.blue{background:linear-gradient(135deg, var(--accent-2), #2563eb)}
  .btn.amber{background:linear-gradient(135deg, var(--accent-3), #d97706)}
  .btn.purple{background:linear-gradient(135deg, var(--purple), #7c3aed)}
  .btn.cyan{background:linear-gradient(135deg, var(--cyan), #0891b2)}
  .btn.red{background:linear-gradient(135deg, var(--accent-4), #b91c1c); color:#fff}
  .pill{padding:6px 10px; border-radius:999px; border:1px dashed var(--border); color:var(--muted); font-size:12px}

  .terminal{
    background:#020617; border:1px solid #0b1220; border-radius:16px; overflow:hidden;
  }
  .term-top{
    display:flex; align-items:center; justify-content:space-between; padding:10px 12px;
    background:linear-gradient(180deg, #0b1220, #060b16);
    border-bottom:1px solid #0f1a2a;
  }
  .dots{display:flex; gap:6px}
  .dot{width:10px; height:10px; border-radius:50%}
  .dot.red{background:#ff5f56}.dot.yellow{background:#ffbd2e}.dot.green{background:#27c93f}
  .term-body{padding:14px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size:13px; line-height:1.45; min-height:200px}
  .cmd{color:#a7f3d0}
  .op{color:#93c5fd}
  .dim{color:#64748b}
  .copybar{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border-top:1px solid #0f1a2a; background:#060b16}
  .copy{background:#0b1220; color:var(--ink); border:1px solid var(--border); padding:8px 12px; border-radius:10px; cursor:pointer}
  .small{font-size:12px; color:var(--muted)}
  .footer{color:var(--muted); text-align:center; padding:16px 0 28px}
  .k{display:grid; gap:8px}
  .span-6{grid-column: span 6}
  .span-4{grid-column: span 4}
  .span-8{grid-column: span 8}
  .span-12{grid-column: span 12}
  @media (max-width: 900px){
    .span-6,.span-4,.span-8{grid-column: span 12}
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">GB</div>
      <div>
        <div class="title">Git Bash Dashboard</div>
        <div class="sub">Generate common Git commands & copy them quickly</div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- Quick Config -->
    <section class="grid">
      <div class="card span-6">
        <h3>🔧 Quick Configure</h3>
        <div class="k">
          <div>
            <label>Username</label>
            <input id="user" placeholder="Your GitHub username" />
          </div>
          <div>
            <label>Email</label>
            <input id="email" placeholder="your_email@example.com" />
          </div>
          <div class="row">
            <button class="btn blue" onclick="emit(`git config --global user.name \"${val('user')}\"`)">Set user.name</button>
            <button class="btn purple" onclick="emit(`git config --global user.email \"${val('email')}\"`)">Set user.email</button>
            <span class="pill">Runs once per machine</span>
          </div>
        </div>
      </div>

      <div class="card span-6">
        <h3>🔐 SSH Setup</h3>
        <div class="k">
          <div class="row">
            <button class="btn green" onclick="emit(`ssh-keygen -t ed25519 -C \"${val('email')||'your_email@example.com'}\"`)">Generate SSH key</button>
            <button class="btn cyan" onclick="emit('eval \"$(ssh-agent -s)\"')">Start ssh-agent</button>
            <button class="btn amber" onclick="emit('ssh-add ~/.ssh/id_ed25519')">Add key to agent</button>
          </div>
          <div class="row">
            <button class="btn blue" onclick="emit('cat ~/.ssh/id_ed25519.pub')">Show public key</button>
            <span class="pill">Copy & add to GitHub → Settings → SSH Keys</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Repo -->
    <section class="grid" style="margin-top:16px">
      <div class="card span-8">
        <h3>📦 Initialize / Clone</h3>
        <div class="k">
          <div>
            <label>Local folder name</label
